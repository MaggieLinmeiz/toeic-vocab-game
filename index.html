<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Gold Master - 單字卡學習系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .header-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }
    select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }
    .mode-btn {
      background: #e0e7ff;
      color: var(--primary);
      font-weight: bold;
      border: none;
    }
    .mode-btn.active {
      background: var(--primary);
      color: white;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: #e5e7eb;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .category-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #e0e7ff;
      color: var(--primary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .word-title {
      font-size: 36px;
      font-weight: 800;
      margin: 10px 0 5px;
      color: #111827;
    }
    .pos-tag {
      font-style: italic;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .meaning {
      font-size: 20px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 15px;
    }
    .details {
      display: none;
      text-align: left;
      border-top: 1px solid #f3f4f6;
      padding-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    .details.show {
      display: block;
    }
    .collocation-item {
      color: #4b5563;
      margin-bottom: 4px;
    }
    .tip-box {
      background: #fffbe6;
      border-left: 3px solid #ffe58f;
      padding: 8px 12px;
      margin: 10px 0;
      font-size: 13px;
      color: #856404;
    }
    .sentence-box {
      color: #1f2937;
      margin-top: 8px;
    }
    .action-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .action-btns button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-prev, .btn-next {
      background: #e5e7eb;
      color: #374151;
      border: none;
    }
    .btn-master {
      background: var(--success);
      color: white;
      border: none;
    }
    .btn-master.mastered {
      background: #9ca3af;
    }
    .flip-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 工具列與模式切換 -->
  <div class="header-tools">
    <select id="categorySelect" onchange="filterCategory()">
      <option value="ALL">所有情境分類 (全部載入)</option>
    </select>
    <button id="modeBtn" class="mode-btn" onclick="toggleMode()">切換：已掌握複習</button>
  </div>

  <!-- 進度列 -->
  <div class="stats-bar">
    <span id="progressText">進度：0 / 0</span>
    <span id="masteredText">已掌握：0</span>
  </div>

  <!-- 單字卡片 -->
  <div class="card" onclick="toggleDetails()">
    <div id="categoryTag" class="category-tag">General Business</div>
    <div id="wordTitle" class="word-title">loading...</div>
    <div id="posText" class="pos-tag"></div>
    <div id="zhText" class="meaning">載入中...</div>

    <!-- 點擊顯示的詳細解析區 -->
    <div id="detailsArea" class="details">
      <strong>【高頻搭配詞】</strong>
      <div id="collocationsList"></div>
      <div id="tipBox" class="tip-box"></div>
      <strong>【多益情境例句】</strong>
      <div id="sentenceEn" class="sentence-box"></div>
      <div id="sentenceZh" style="color: #6b7280;"></div>
    </div>

    <div class="flip-hint">點擊卡片任意處翻轉看解析 ↺</div>
  </div>

  <!-- 操作按鈕 -->
  <div class="action-btns">
    <button class="btn-prev" onclick="prevWord()">上一題</button>
    <button id="masterBtn" class="btn-master" onclick="toggleMastered()">記住了 ✓</button>
    <button class="btn-next" onclick="nextWord()">下一題</button>
  </div>
</div>

<script>
  let allVocab = [];           // 全部 1,800 單字
  let currentList = [];        // 當前模式發放的單字清單
  let currentIndex = 0;        // 當前單字索引
  let masteredWords = new Set();// 已掌握單字的單字名 (Set 結構)
  let isReviewMode = false;    // 是否處於「已掌握複習模式」

  // 1. 初始化頁面並讀取 LocalStorage 紀錄
  window.onload = async () => {
    loadLocalStorageData();
    await fetchVocabData();
    setupCategories();
    updateCurrentList();
    renderCard();
  };

  // 2. 從瀏覽器讀取紀錄
  function loadLocalStorageData() {
    const savedMastered = localStorage.getItem('toeic_mastered_words');
    if (savedMastered) {
      masteredWords = new Set(JSON.parse(savedMastered));
    }
    const savedIndex = localStorage.getItem('toeic_current_index');
    if (savedIndex) {
      currentIndex = parseInt(savedIndex, 10) || 0;
    }
  }

  // 3. 讀取 JSON 檔案
  async function fetchVocabData() {
    try {
      const res = await fetch('vocab.json');
      allVocab = await res.json();
    } catch (err) {
      alert('無法讀取 vocab.json 檔案，請確認檔案路徑與 JSON 格式正確！');
    }
  }

  // 4. 設定選單分類
  function setupCategories() {
    const select = document.getElementById('categorySelect');
    const categories = [...new Set(allVocab.map(item => item.category))];
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  // 5. 更新當前運作的單字清單
  function updateCurrentList() {
    const selectedCat = document.getElementById('categorySelect').value;
    
    // 篩選分類
    let list = (selectedCat === 'ALL') 
      ? allVocab 
      : allVocab.filter(item => item.category === selectedCat);

    // 篩選模式：一般模式 (學習中) vs 複習模式 (已掌握)
    if (isReviewMode) {
      currentList = list.filter(item => masteredWords.has(item.word));
    } else {
      currentList = list;
    }

    // 防止索引超出範圍
    if (currentIndex >= currentList.length) {
      currentIndex = 0;
    }
  }

  // 6. 渲染單字卡片畫面
  function renderCard() {
    document.getElementById('masteredText').textContent = `已掌握：${masteredWords.size}`;

    if (currentList.length === 0) {
      document.getElementById('progressText').textContent = `進度：0 / 0`;
      document.getElementById('wordTitle').textContent = isReviewMode ? "無已掌握單字" : "無單字資料";
      document.getElementById('posText').textContent = "";
      document.getElementById('zhText').textContent = isReviewMode ? "您還沒有標記任何「記住了」的單字喔！" : "";
      document.getElementById('detailsArea').classList.remove('show');
      return;
    }

    const item = currentList[currentIndex];
    document.getElementById('progressText').textContent = `進度：${currentIndex + 1} / ${currentList.length}`;
    document.getElementById('categoryTag').textContent = item.category || 'General';
    document.getElementById('wordTitle').textContent = item.word;
    document.getElementById('posText').textContent = item.pos;
    document.getElementById('zhText').textContent = item.zh;

    // 搭配詞
    const colList = document.getElementById('collocationsList');
    colList.innerHTML = '';
    (item.collocations || []).forEach(c => {
      const div = document.createElement('div');
      div.className = 'collocation-item';
      div.textContent = `• ${c}`;
      colList.appendChild(div);
    });

    // 提示與例句
    document.getElementById('tipBox').textContent = item.tip || '';
    document.getElementById('sentenceEn').textContent = item.sentence || '';
    document.getElementById('sentenceZh').textContent = item.sentenceZh || '';

    // 隱藏詳細解析，收起卡片
    document.getElementById('detailsArea').classList.remove('show');

    // 按鈕狀態顯示
    const masterBtn = document.getElementById('masterBtn');
    if (masteredWords.has(item.word)) {
      masterBtn.textContent = '已掌握 ✓';
      masterBtn.classList.add('mastered');
    } else {
      masterBtn.textContent = '記住了 ✓';
      masterBtn.classList.remove('mastered');
    }

    // 儲存當前閱讀位置至 LocalStorage (僅在非複習模式下記錄主進度)
    if (!isReviewMode && selectedCategoryIsAll()) {
      localStorage.setItem('toeic_current_index', currentIndex);
    }
  }

  function selectedCategoryIsAll() {
    return document.getElementById('categorySelect').value === 'ALL';
  }

  // 7. 點擊「記住了✓」按鈕切換狀態
  function toggleMastered() {
    if (currentList.length === 0) return;
    const item = currentList[currentIndex];
    
    if (masteredWords.has(item.word)) {
      masteredWords.delete(item.word);
    } else {
      masteredWords.add(item.word);
    }

    // 寫入瀏覽器本地儲存
    localStorage.setItem('toeic_mastered_words', JSON.stringify([...masteredWords]));
    
    renderCard();
  }

  // 8. 模式切換：學習模式 <-> 已掌握複習模式
  function toggleMode() {
    isReviewMode = !isReviewMode;
    const btn = document.getElementById('modeBtn');
    
    if (isReviewMode) {
      btn.textContent = '切換：全單字學習';
      btn.classList.add('active');
    } else {
      btn.textContent = '切換：已掌握複習';
      btn.classList.remove('active');
    }

    currentIndex = 0;
    updateCurrentList();
    renderCard();
  }

  // 9. 分類切換
  function filterCategory() {
    currentIndex = 0;
    updateCurrentList();
    renderCard();
  }

  // 10. 卡片翻轉
  function toggleDetails() {
    const details = document.getElementById('detailsArea');
    details.classList.toggle('show');
  }

  // 11. 上一題 / 下一題
  function nextWord() {
    if (currentList.length === 0) return;
    currentIndex = (currentIndex + 1) % currentList.length;
    renderCard();
  }

  function prevWord() {
    if (currentList.length === 0) return;
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    renderCard();
  }
</script>

</body>
</html>
