<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Gold Master - 3000 單全冊衝金特訓</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 600px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .controls-bar {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .category-select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            background: white;
            color: var(--text-main);
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* 3D 翻牌閃卡容器 */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 420px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8fafc;
            overflow-y: auto;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag {
            background: #e0e7ff;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .audio-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .card-content-center {
            text-align: center;
            margin: auto 0;
        }

        .word-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .word-pos {
            font-size: 1rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .word-zh {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 600;
        }

        .card-footer-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid #f1f5f9;
            padding-top: 0.75rem;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .collocations-box, .tip-box, .sentence-box {
            background: #ffffff;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
        }

        .tip-content {
            font-size: 0.875rem;
            color: #b45309;
            background: #fef3c7;
            padding: 0.5rem;
            border-radius: 6px;
            border-left: 4px solid #f59e0b;
        }

        .sentence-content {
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .sentence-zh {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .btn-success {
            background: var(--accent);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOEIC Gold Master</h1>
        <p>多益必考 3000 單字庫特訓</p>
    </header>

    <div class="controls-bar">
        <select id="category-select" class="category-select">
            <option value="ALL">所有情境分類 (全部載入)</option>
        </select>
    </div>

    <div class="container">
        <div class="stats-bar">
            <span id="progress-text">載入中...</span>
            <span id="score-text">已掌握：0</span>
        </div>

        <div class="flashcard-container" id="card-container">
            <div class="flashcard" id="flashcard">
                <!-- 正面 -->
                <div class="card-face card-front">
                    <div class="card-top">
                        <span class="tag" id="card-tag">分類載入中</span>
                        <button class="audio-btn" id="audio-btn" title="發音">🔊</button>
                    </div>
                    <div class="card-content-center">
                        <div class="word-title" id="card-word">Loading...</div>
                        <div class="word-pos" id="card-pos"></div>
                        <div class="word-zh" id="card-zh"></div>
                    </div>
                    <div class="card-footer-hint">點擊卡片任意處翻轉看解析 ⟲</div>
                </div>

                <!-- 背面 -->
                <div class="card-face card-back">
                    <div>
                        <div class="section-title">常考搭配詞 / 延伸變體</div>
                        <div class="collocations-box" id="card-collocations"></div>

                        <div class="section-title">考點與解題密技</div>
                        <div class="tip-box">
                            <div class="tip-content" id="card-tip"></div>
                        </div>

                        <div class="section-title">情境例句</div>
                        <div class="sentence-box">
                            <div class="sentence-content" id="card-sentence"></div>
                            <div class="sentence-zh" id="card-sentence-zh"></div>
                        </div>
                    </div>
                    <div class="card-footer-hint">再次點擊卡片可翻回正面 ⟲</div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-secondary" id="prev-btn">上一題</button>
            <button class="btn btn-success" id="mastered-btn">記住了 ✓</button>
            <button class="btn btn-secondary" id="next-btn">下一題</button>
        </div>
    </div>

    <script>
        let rawVocabData = [];
        let filteredData = [];
        let currentIndex = 0;
        let masteredCount = 0;

        const flashcard = document.getElementById('flashcard');
        const cardContainer = document.getElementById('card-container');
        const cardTag = document.getElementById('card-tag');
        const cardWord = document.getElementById('card-word');
        const cardPos = document.getElementById('card-pos');
        const cardZh = document.getElementById('card-zh');
        const cardCollocations = document.getElementById('card-collocations');
        const cardTip = document.getElementById('card-tip');
        const cardSentence = document.getElementById('card-sentence');
        const cardSentenceZh = document.getElementById('card-sentence-zh');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');
        const categorySelect = document.getElementById('category-select');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const masteredBtn = document.getElementById('mastered-btn');
        const audioBtn = document.getElementById('audio-btn');

        // 從外部 vocab.json 讀取資料
        fetch('vocab.json')
            .then(res => res.json())
            .then(data => {
                rawVocabData = data;
                initCategories();
                filterData('ALL');
            })
            .catch(err => {
                cardWord.textContent = "Error";
                cardZh.textContent = "請確認已建立 vocab.json 檔案";
            });

        function initCategories() {
            const categories = [...new Set(rawVocabData.map(item => item.category))];
            categories.forEach(cat => {
                if (cat) {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    categorySelect.appendChild(opt);
                }
            });
        }

        categorySelect.addEventListener('change', (e) => {
            filterData(e.target.value);
        });

        function filterData(cat) {
            if (cat === 'ALL') {
                filteredData = [...rawVocabData];
            } else {
                filteredData = rawVocabData.filter(item => item.category === cat);
            }
            currentIndex = 0;
            if (filteredData.length > 0) {
                loadCard(currentIndex);
            }
        }

        function loadCard(index) {
            const data = filteredData[index];
            cardTag.textContent = data.category || "多益必考";
            cardWord.textContent = data.word;
            cardPos.textContent = data.pos || "";
            cardZh.textContent = data.zh || "";
            cardCollocations.textContent = data.collocations || "常用搭配詞補充中...";
            cardTip.textContent = data.tip || "核心單字，請精通拼寫與發音。";
            cardSentence.textContent = data.sentence || "";
            cardSentenceZh.textContent = data.sentenceZh || "";

            progressText.textContent = `進度：${index + 1} / ${filteredData.length}`;
            scoreText.textContent = `已掌握：${masteredCount}`;
            flashcard.classList.remove('is-flipped');
        }

        cardContainer.addEventListener('click', (e) => {
            if (e.target.closest('#audio-btn')) return;
            flashcard.classList.toggle('is-flipped');
        });

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!filteredData[currentIndex]) return;
            const word = filteredData[currentIndex].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        });

        prevBtn.addEventListener('click', () => {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
            loadCard(currentIndex);
        });

        nextBtn.addEventListener('click', () => {
            if (filteredData.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredData.length;
            loadCard(currentIndex);
        });

        masteredBtn.addEventListener('click', () => {
            if (filteredData.length === 0) return;
            masteredCount++;
            scoreText.textContent = `已掌握：${masteredCount}`;
            if (currentIndex < filteredData.length - 1) {
                currentIndex++;
                loadCard(currentIndex);
            } else {
                alert('恭喜您已完成本區塊單字複習！');
                currentIndex = 0;
                loadCard(currentIndex);
            }
        });
    </script>
</body>
</html>
