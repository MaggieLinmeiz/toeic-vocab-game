<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Gold Master - 終極特訓系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .streak-bar {
      background: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-weight: bold;
    }
    .streak-badge {
      color: #f59e0b;
      font-size: 16px;
    }
    .header-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    select, button, input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    select { flex: 1; }
    .mode-btn {
      background: white;
      color: var(--text);
      cursor: pointer;
      flex: 1;
    }
    .mode-btn.active {
      background: var(--primary);
      color: white;
      font-weight: bold;
      border-color: var(--primary);
    }
    .btn-reset {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #f87171;
      cursor: pointer;
      font-weight: bold;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: #e5e7eb;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .category-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #e0e7ff;
      color: var(--primary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .word-title {
      font-size: 36px;
      font-weight: 800;
      margin: 10px 0 5px;
      color: #111827;
    }
    .pos-tag { font-style: italic; color: #6b7280; margin-bottom: 8px; }
    .meaning { font-size: 20px; font-weight: bold; color: #374151; margin-bottom: 15px; }
    .details {
      display: none;
      text-align: left;
      border-top: 1px solid #f3f4f6;
      padding-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    .details.show { display: block; }
    .action-btns { display: flex; gap: 10px; margin-top: 20px; }
    .action-btns button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-prev, .btn-next { background: #e5e7eb; color: #374151; border: none; }
    .btn-master { background: var(--success); color: white; border: none; }
    
    /* 拼字測驗專用樣式 */
    .test-input {
      width: 80%;
      margin: 15px auto;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
    }
    .test-feedback {
      font-weight: bold;
      margin-top: 10px;
      min-height: 24px;
    }
    .feedback-correct { color: var(--success); }
    .feedback-wrong { color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <!-- 每日打卡天數欄位 -->
  <div class="streak-bar">
    <span>📅 每日學習打卡</span>
    <span id="streakText" class="streak-badge">🔥 連續 1 天</span>
  </div>

  <!-- 功能與分類列 -->
  <div class="header-tools">
    <select id="categorySelect" onchange="changeFilter()">
      <option value="ALL">所有情境分類</option>
    </select>
    <button class="btn-reset" onclick="resetAllProgress()" title="清除所有進度重新挑戰">重置進度</button>
  </div>
  
  <div class="header-tools">
    <button id="btnModeLearn" class="mode-btn active" onclick="switchMode('learn')">未掌握庫</button>
    <button id="btnModeTest" class="mode-btn" onclick="switchMode('test')">拼字測驗</button>
    <button id="btnModeWrong" class="mode-btn" onclick="switchMode('wrong')">錯題本</button>
    <button id="btnModeMaster" class="mode-btn" onclick="switchMode('mastered')">已掌握</button>
  </div>

  <!-- 數據資訊 -->
  <div class="stats-bar">
    <span id="progressText">進度：0 / 0</span>
    <span id="statsSummary">已掌握: 0 | 錯題: 0</span>
  </div>

  <!-- 學習／測驗卡片區域 -->
  <div class="card" id="cardElement" onclick="handleCardClick()">
    <div id="categoryTag" class="category-tag">General</div>
    <div id="wordTitle" class="word-title">載入中...</div>
    <div id="posText" class="pos-tag"></div>
    <div id="zhText" class="meaning"></div>

    <!-- 拼字輸入區域 (測驗模式開啟) -->
    <div id="testArea" style="display: none;" onclick="event.stopPropagation()">
      <input type="text" id="spellInput" class="test-input" placeholder="請輸入英文單字" autocomplete="off" onkeydown="if(event.key==='Enter') checkSpelling()">
      <button onclick="checkSpelling()" style="background: var(--primary); color: white; border: none; margin-top: 5px;">送出檢查</button>
      <div id="testFeedback" class="test-feedback"></div>
    </div>

    <!-- 學習解析區 -->
    <div id="detailsArea" class="details">
      <strong>【高頻搭配詞】</strong>
      <div id="collocationsList"></div>
      <div id="tipBox" style="background:#fffbe6; padding:8px; margin:8px 0; font-size:13px; color:#856404;"></div>
      <strong>【多益例句】</strong>
      <div id="sentenceEn"></div>
      <div id="sentenceZh" style="color: #6b7280;"></div>
    </div>

    <div id="flipHint" style="font-size: 12px; color: #9ca3af; margin-top: 10px;">點擊卡片任意處看解析 ↺</div>
  </div>

  <!-- 控制按鈕 -->
  <div class="action-btns">
    <button class="btn-prev" onclick="prevWord()">上一題</button>
    <button id="masterBtn" class="btn-master" onclick="markMastered()">標記為已掌握 ✓</button>
    <button class="btn-next" onclick="nextWord()">下一題</button>
  </div>
</div>

<script>
  let allVocab = [];
  let currentList = [];
  let currentIndex = 0;
  
  let masteredWords = new Set();
  let wrongWords = new Set();
  let currentMode = 'learn'; // 'learn', 'test', 'wrong', 'mastered'

  window.onload = async () => {
    updateStreak();
    loadLocalStorageData();
    await fetchVocabData();
    setupCategories();
    updateCurrentList();
    renderCard();
  };

  // 1. 每日連續登入天數計算
  function updateStreak() {
    const today = new Date().toISOString().split('T')[0];
    const lastDate = localStorage.getItem('toeic_last_login');
    let streak = parseInt(localStorage.getItem('toeic_streak_count') || '0', 10);

    if (lastDate) {
      const diffDays = (new Date(today) - new Date(lastDate)) / (1000 * 3600 * 24);
      if (diffDays === 1) {
        streak += 1;
      } else if (diffDays > 1) {
        streak = 1;
      }
    } else {
      streak = 1;
    }

    localStorage.setItem('toeic_last_login', today);
    localStorage.setItem('toeic_streak_count', streak);
    document.getElementById('streakText').textContent = `🔥 連續 ${streak} 天`;
  }

  // 2. 載入 LocalStorage
  function loadLocalStorageData() {
    const savedMastered = localStorage.getItem('toeic_mastered_words');
    if (savedMastered) masteredWords = new Set(JSON.parse(savedMastered));
    
    const savedWrong = localStorage.getItem('toeic_wrong_words');
    if (savedWrong) wrongWords = new Set(JSON.parse(savedWrong));
  }

  function saveData() {
    localStorage.setItem('toeic_mastered_words', JSON.stringify([...masteredWords]));
    localStorage.setItem('toeic_wrong_words', JSON.stringify([...wrongWords]));
  }

  // 3. 一鍵重置所有學習進度
  function resetAllProgress() {
    if (confirm('確定要清除所有已掌握與錯題紀錄，重新展開 1,800 單全新挑戰嗎？')) {
      localStorage.removeItem('toeic_mastered_words');
      localStorage.removeItem('toeic_wrong_words');
      localStorage.removeItem('toeic_current_index');
      masteredWords.clear();
      wrongWords.clear();
      currentIndex = 0;
      updateCurrentList();
      renderCard();
      alert('已成功重置所有進度，重新出發！');
    }
  }

  // 4. 抓取 JSON 資料
  async function fetchVocabData() {
    try {
      const res = await fetch('vocab.json');
      allVocab = await res.json();
    } catch (err) {
      alert('無法讀取 vocab.json 檔案！');
    }
  }

  function setupCategories() {
    const select = document.getElementById('categorySelect');
    const categories = [...new Set(allVocab.map(item => item.category))];
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  // 5. 更新當前運作的單字清單 (自動扣除已掌握單字)
  function updateCurrentList() {
    const cat = document.getElementById('categorySelect').value;
    let list = (cat === 'ALL') ? allVocab : allVocab.filter(item => item.category === cat);

    if (currentMode === 'learn') {
      currentList = list.filter(item => !masteredWords.has(item.word));
    } else if (currentMode === 'test') {
      currentList = list.filter(item => !masteredWords.has(item.word));
    } else if (currentMode === 'wrong') {
      currentList = list.filter(item => wrongWords.has(item.word));
    } else if (currentMode === 'mastered') {
      currentList = list.filter(item => masteredWords.has(item.word));
    }

    if (currentIndex >= currentList.length) currentIndex = 0;
  }

  // 6. 畫面渲染
  function renderCard() {
    document.getElementById('statsSummary').textContent = `已掌握: ${masteredWords.size} | 錯題: ${wrongWords.size}`;
    const testArea = document.getElementById('testArea');
    const masterBtn = document.getElementById('masterBtn');
    const flipHint = document.getElementById('flipHint');

    if (currentList.length === 0) {
      document.getElementById('progressText').textContent = `進度：0 / 0`;
      document.getElementById('wordTitle').textContent = "恭喜通關！";
      document.getElementById('posText').textContent = "";
      document.getElementById('zhText').textContent = currentMode === 'learn' ? "此分類的未掌握單字已全部清空！" : "此清單目前沒有單字喔！";
      document.getElementById('detailsArea').classList.remove('show');
      testArea.style.display = 'none';
      return;
    }

    const item = currentList[currentIndex];
    document.getElementById('progressText').textContent = `進度：${currentIndex + 1} / ${currentList.length}`;
    document.getElementById('categoryTag').textContent = item.category || 'General';
    document.getElementById('posText').textContent = item.pos;
    document.getElementById('zhText').textContent = item.zh;

    // 模式判斷
    if (currentMode === 'test') {
      document.getElementById('wordTitle').textContent = "❓ 拼字挑戰";
      testArea.style.display = 'block';
      document.getElementById('spellInput').value = '';
      document.getElementById('testFeedback').textContent = '';
      masterBtn.style.display = 'none';
      flipHint.style.display = 'none';
    } else {
      document.getElementById('wordTitle').textContent = item.word;
      testArea.style.display = 'none';
      masterBtn.style.display = 'block';
      flipHint.style.display = 'block';
      
      if (currentMode === 'mastered') {
        masterBtn.textContent = '移出已掌握';
      } else {
        masterBtn.textContent = '標記為已掌握 ✓';
      }
    }

    // 搭配詞與例句
    const colList = document.getElementById('collocationsList');
    colList.innerHTML = '';
    (item.collocations || []).forEach(c => {
      const div = document.createElement('div');
      div.textContent = `• ${c}`;
      colList.appendChild(div);
    });
    document.getElementById('tipBox').textContent = item.tip || '';
    document.getElementById('sentenceEn').textContent = item.sentence || '';
    document.getElementById('sentenceZh').textContent = item.sentenceZh || '';

    document.getElementById('detailsArea').classList.remove('show');
  }

  // 7. 拼字檢查邏輯
  function checkSpelling() {
    if (currentList.length === 0) return;
    const item = currentList[currentIndex];
    const inputVal = document.getElementById('spellInput').value.trim().toLowerCase();
    const feedback = document.getElementById('testFeedback');
    const details = document.getElementById('detailsArea');

    if (inputVal === item.word.toLowerCase()) {
      feedback.textContent = "🎉 完全正確！已晉升至【已掌握】！";
      feedback.className = "test-feedback feedback-correct";
      
      masteredWords.add(item.word);
      wrongWords.delete(item.word);
      saveData();

      setTimeout(() => {
        updateCurrentList();
        renderCard();
      }, 1200);

    } else {
      feedback.textContent = `❌ 拼錯囉！正確答案是：${item.word}`;
      feedback.className = "test-feedback feedback-wrong";
      details.classList.add('show');
      
      wrongWords.add(item.word);
      saveData();
    }
  }

  // 8. 切換模式按鈕
  function switchMode(mode) {
    currentMode = mode;
    ['Learn', 'Test', 'Wrong', 'Master'].forEach(m => {
      document.getElementById(`btnMode${m}`).classList.remove('active');
    });
    
    if (mode === 'learn') document.getElementById('btnModeLearn').classList.add('active');
    if (mode === 'test') document.getElementById('btnModeTest').classList.add('active');
    if (mode === 'wrong') document.getElementById('btnModeWrong').classList.add('active');
    if (mode === 'mastered') document.getElementById('btnModeMaster').classList.add('active');

    currentIndex = 0;
    updateCurrentList();
    renderCard();
  }

  function changeFilter() {
    currentIndex = 0;
    updateCurrentList();
    renderCard();
  }

  function handleCardClick() {
    if (currentMode !== 'test') {
      document.getElementById('detailsArea').classList.toggle('show');
    }
  }

  function markMastered() {
    if (currentList.length === 0) return;
    const item = currentList[currentIndex];
    
    if (masteredWords.has(item.word)) {
      masteredWords.delete(item.word);
    } else {
      masteredWords.add(item.word);
      wrongWords.delete(item.word);
    }
    
    saveData();
    updateCurrentList();
    renderCard();
  }

  function nextWord() {
    if (currentList.length === 0) return;
    currentIndex = (currentIndex + 1) % currentList.length;
    renderCard();
  }

  function prevWord() {
    if (currentList.length === 0) return;
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    renderCard();
  }
</script>

</body>
</html>
