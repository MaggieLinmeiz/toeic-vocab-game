<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC Gold Master - 終極特訓系統</title>
  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .streak-bar {
      background: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-weight: bold;
    }
    .streak-badge {
      color: #f59e0b;
      font-size: 16px;
    }
    .header-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    select, button, input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    select { flex: 1; }
    .mode-btn {
      background: white;
      color: var(--text);
      cursor: pointer;
      flex: 1;
    }
    .mode-btn.active {
      background: var(--primary);
      color: white;
      font-weight: bold;
      border-color: var(--primary);
    }
    .btn-reset {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #f87171;
      cursor: pointer;
      font-weight: bold;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: #e5e7eb;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 500;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .category-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #e0e7ff;
      color: var(--primary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .word-title {
      font-size: 36px;
      font-weight: 800;
      margin: 0;
      color: #111827;
    }
    .pos-tag { font-style: italic; color: #6b7280; margin-bottom: 8px; }
    .meaning { font-size: 20px; font-weight: bold; color: #374151; margin-bottom: 15px; }
    .details {
      display: none;
      text-align: left;
      border-top: 1px solid #f3f4f6;
      padding-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    .details.show { display: block; }
    .action-btns { display: flex; gap: 10px; margin-top: 20px; }
    .action-btns button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-prev, .btn-next { background: #e5e7eb; color: #374151; border: none; }
    .btn-master { background: var(--success); color: white; border: none; }
    
    /* 拼字測驗專用樣式 */
    .test-input {
      width: 80%;
      margin: 15px auto;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
    }
    .test-feedback {
      font-weight: bold;
      margin-top: 10px;
      min-height: 24px;
    }
    .feedback-correct { color: var(--success); }
    .feedback-wrong { color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <!-- 每日打卡天數欄位 -->
  <div class="streak-bar">
    <span>📅 每日學習打卡</span>
    <span id="streakText" class="streak-badge">🔥 連續 1 天</span>
  </div>

  <!-- 功能與分類列 -->
  <div class="header-tools">
    <select id="categorySelect" onchange="changeFilter()">
      <option value="ALL">所有情境分類</option>
    </select>
    <button class="btn-reset" onclick="resetAllProgress()" title="清除所有進度重新挑戰">重置進度</button>
  </div>
  
  <div class="header-tools">
    <button id="btnModeLearn" class="mode-btn active" onclick="switchMode('learn')">未掌握庫</button>
    <button id="btnModeTest" class="mode-btn" onclick="switchMode('test')">拼字測驗</button>
    <button id="btnModeWrong" class="mode-btn" onclick="switchMode('wrong')">錯題本</button>
    <button id="btnModeMaster" class="mode-btn" onclick="switchMode('mastered')">已掌握</button>
  </div>

  <!-- 數據資訊 -->
  <div class="stats-bar">
    <span id="progressText">進度：0 / 0</span>
    <span id="statsSummary">已掌握: 0 | 錯題: 0</span>
  </div>

  <!-- 學習／測驗卡片區域 -->
  <div class="card" id="cardElement" onclick="handleCardClick()">
    <div id="categoryTag" class="category-tag">General</div>

    <!-- 單字標題與發音按鈕區塊 -->
    <div id="wordHeaderBox" style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 10px 0 5px;" onclick="event.stopPropagation()">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div id="wordTitle" class="word-title">載入中...</div>
        <!-- 發音喇叭按鈕 -->
        <button onclick="speakWord()" title="播放發音" style="background: #f0f2f5; border: 1px solid #dcdfe6; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" onmouseover="this.style.background='#e4e7ed'" onmouseout="this.style.background='#f0f2f5'">
          🔊
        </button>
      </div>

      <!-- 多國口音切換選單 -->
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #606266; margin-top: 2px;">
        <span>口音：</span>
        <select id="accentSelect" onchange="changeAccent(this.value)" style="padding: 2px 6px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 12px; cursor: pointer; background-color: #fff;">
          <option value="en-US">🇺🇸 美音 (US)</option>
          <option value="en-GB">🇬🇧 英音 (UK)</option>
          <option value="en-AU">🇦🇺 澳音 (AU)</option>
          <option value="random" selected>🎲 多益混合 (隨機)</option>
        </select>
      </div>
    </div>

    <div id="posText" class="pos-tag"></div>
    <div id="zhText" class="meaning"></div>

    <!-- 拼字輸入區域 (測驗模式開啟) -->
    <div id="testArea" style="display: none;" onclick="event.stopPropagation()">
      <input type="text" id="spellInput" class="test-input" placeholder="請輸入英文單字" autocomplete="off" onkeydown="if(event.key==='Enter') checkSpelling()">
      <button onclick="checkSpelling()" style="background: var(--primary); color: white; border: none; margin-top: 5px;">送出檢查</button>
      <div id="testFeedback" class="test-feedback"></div>
    </div>

    <!-- 學習解析區 -->
    <div id="detailsArea" class="details">
      <strong>【高頻搭配詞】</strong>
      <div id="collocationsList"></div>
      <div id="tipBox" style="background:#fffbe6; padding:8px; margin:8px 0; font-size:13px; color:#856404;"></div>
      <strong>【多益例句】</strong>
      <div id="sentenceEn"></div>
      <div id="sentenceZh" style="color: #6b7280;"></div>
    </div>

    <div id="flipHint" style="font-size: 12px; color: #9ca3af; margin-top: 10px;">點擊卡片任意處看解析 ↺</div>
  </div>

  <!-- 控制按鈕 -->
  <div class="action-btns">
    <button class="btn-prev" onclick="prevWord()">上一題</button>
    <button id="masterBtn" class="btn-master" onclick="markMastered()">標記為已掌握 ✓</button>
    <button class="btn-next" onclick="nextWord()">下一題</button>
  </div>
</div>

<script>
  let allVocab = [];
  let currentList = [];
  let currentIndex = 0;
  
  let masteredWords = new Set();
  let wrongWords = new Set();
  let currentMode = 'learn'; // 'learn', 'test', 'wrong', 'mastered'
  let selectedAccent = 'random'; // 預設多益隨機口音

  window.onload = async () => {
    updateStreak();
    loadLocalStorageData();
    await fetchVocabData();
    setupCategories();
    updateCurrentList();
    renderCard();
  };

  // 1. 每日連續登入天數計算
  function updateStreak() {
    const today = new Date().toISOString().split('T')[0];
    const lastDate = localStorage.getItem('toeic_last_login');
    let streak = parseInt(localStorage.getItem('toeic_streak_count') || '0', 10);

    if (lastDate) {
      const diffDays = (new Date(today) - new Date(lastDate)) / (1000 * 3600 * 24);
      if (diffDays === 1) {
        streak += 1;
      } else if (diffDays > 1) {
        streak = 1;
      }
    } else {
      streak = 1;
    }

    localStorage.setItem('toeic_last_login', today);
    localStorage.setItem('toeic_streak_count', streak);
    document.getElementById('streakText').textContent = `🔥 連續 ${streak} 天`;
  }

  // 2. 載入 LocalStorage
  function loadLocalStorageData() {
    const savedMastered = localStorage.getItem('toeic_mastered_words');
    if (savedMastered) masteredWords = new Set(JSON.parse(savedMastered));
    
    const savedWrong = localStorage.getItem('toeic_wrong_words');
    if (savedWrong) wrongWords = new Set(JSON.parse(savedWrong));
  }

  function saveData() {
    localStorage.setItem('toeic_mastered_words', JSON.stringify([...masteredWords]));
    localStorage.setItem('toeic_wrong_words', JSON.stringify([...wrongWords]));
  }

  // 3. 一鍵重置所有學習進度
  function resetAllProgress() {
    if (confirm('確定要清除所有已掌握與錯題紀錄，重新展開挑戰嗎？')) {
      localStorage.removeItem('toeic_mastered_words');
      localStorage.removeItem('toeic_wrong_words');
      localStorage.removeItem('toeic_current_index');
      masteredWords.clear();
      wrongWords.clear();
      currentIndex = 0;
      updateCurrentList();
      renderCard();
      alert('已成功重置所有進度，重新出發！');
    }
  }

  // 4. 抓取 JSON 資料
  async function fetchVocabData() {
    try {
      const res = await fetch('vocab.json');
      allVocab = await res.json();
    } catch (err) {
      alert('無法讀取 vocab.json 檔案！');
    }
  }

  function setupCategories() {
    const select = document.getElementById('categorySelect');
    const categories = [...new Set(allVocab.map(item => item.category))];
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  // 5. 更新當前運作的單字清單 (自動扣除已掌握單字)
  function updateCurrentList() {
    const cat = document.getElementById('categorySelect').value;
    let list = (cat === 'ALL') ? allVocab : allVocab.filter(item => item.category === cat);

    if (currentMode === 'learn') {
      currentList = list.filter(item => !masteredWords.has(item.word));
    } else if (currentMode === 'test') {
      currentList = list.filter(item => !masteredWords.has(item.word));
    } else if (currentMode === 'wrong') {
      currentList = list.filter(item => wrongWords.has(item.word));
    } else if (currentMode === 'mastered') {
      currentList = list.filter(item => masteredWords.has(item.word));
    }

    if (currentIndex >= currentList.length) currentIndex = 0;
  }

  // 6. 畫面渲染
  function renderCard() {
    document.getElementById('statsSummary').textContent = `已掌握: ${masteredWords.size} | 錯題: ${wrongWords.size}`;
    const testArea = document.getElementById('testArea');
    const masterBtn = document.getElementById('masterBtn');
    const flipHint = document.getElementById('flipHint');
    const wordHeaderBox = document.getElementById('wordHeaderBox');

    if (currentList.length === 0) {
      document.getElementById('progressText').textContent = `進度：0 / 0`;
      document.getElementById('wordTitle').textContent = "恭喜通關！";
      wordHeaderBox.style.display = 'none';
      document.getElementById('posText').textContent = "";
      document.getElementById('
